name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build:all

      - name: Download portable Node
        shell: pwsh
        run: |
          $version = (Get-Content .nvmrc -Raw).Trim()
          $url = "https://nodejs.org/dist/v$version/node-v$version-win-x64.zip"
          Write-Host "Baixando $url"
          Invoke-WebRequest -Uri $url -OutFile node-win-x64.zip
          Expand-Archive node-win-x64.zip -DestinationPath node-runtime

      - name: Package portable app
        shell: pwsh
        run: |
          $node = Get-ChildItem node-runtime -Recurse -Filter node.exe | Select-Object -First 1
          if (-not $node) { throw "node.exe nao encontrado no runtime baixado." }
          ./scripts/package-release.ps1 -SkipBuild -NodeExe $node.FullName

      - name: Build source zip
        shell: pwsh
        run: git archive --format=zip -o release/n2-source.zip HEAD

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: n2-release
          path: release/*.zip*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/n2-windows-x64.zip
            release/n2-windows-x64.zip.sha256
            release/n2-source.zip
          body_path: docs/RELEASE-NOTES.md
          fail_on_unmatched_files: true
